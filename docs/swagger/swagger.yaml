basePath: /api/v1
definitions:
  bom-zustand-api_internal_auth.Permission:
    enum:
    - user:create
    - user:read
    - user:update
    - user:delete
    - template:create
    - template:read
    - template:update
    - template:delete
    - report:create
    - report:read
    - report:update
    - report:delete
    - report:generate
    type: string
    x-enum-varnames:
    - PermUserCreate
    - PermUserRead
    - PermUserUpdate
    - PermUserDelete
    - PermTemplateCreate
    - PermTemplateRead
    - PermTemplateUpdate
    - PermTemplateDelete
    - PermReportCreate
    - PermReportRead
    - PermReportUpdate
    - PermReportDelete
    - PermReportGenerate
  bom-zustand-api_internal_model.ReportDefinition:
    properties:
      collection:
        type: string
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      paramSchema:
        items:
          $ref: '#/definitions/bom-zustand-api_internal_model.ReportParam'
        type: array
      pipelineTemplate:
        type: string
      templateId:
        type: string
      updatedAt:
        type: string
    type: object
  bom-zustand-api_internal_model.ReportParam:
    properties:
      label:
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        type: string
    type: object
  bom-zustand-api_internal_model.Template:
    properties:
      createdAt:
        type: string
      description:
        type: string
      htmlContent:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  bom-zustand-api_internal_model.User:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      updatedAt:
        type: string
    type: object
  internal_handler.changePasswordRequest:
    properties:
      newPassword:
        minLength: 8
        type: string
      oldPassword:
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  internal_handler.createReportRequest:
    properties:
      collection:
        type: string
      name:
        type: string
      paramSchema:
        items:
          $ref: '#/definitions/bom-zustand-api_internal_model.ReportParam'
        type: array
      pipelineTemplate:
        type: string
      templateId:
        type: string
    required:
    - collection
    - name
    - pipelineTemplate
    - templateId
    type: object
  internal_handler.createTemplateRequest:
    properties:
      description:
        type: string
      htmlContent:
        type: string
      name:
        type: string
    required:
    - htmlContent
    - name
    type: object
  internal_handler.createUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        enum:
        - admin
        - manager
        - staff
        - viewer
        type: string
    required:
    - email
    - name
    - role
    type: object
  internal_handler.errorResponse:
    properties:
      error:
        type: string
    type: object
  internal_handler.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_handler.generateReportRequest:
    properties:
      params:
        additionalProperties: true
        type: object
    type: object
  internal_handler.healthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  internal_handler.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handler.meResponse:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/bom-zustand-api_internal_auth.Permission'
        type: array
      role:
        type: string
      updatedAt:
        type: string
    type: object
  internal_handler.messageResponse:
    properties:
      message:
        type: string
    type: object
  internal_handler.refreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  internal_handler.resetPasswordRequest:
    properties:
      newPassword:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - newPassword
    - token
    type: object
  internal_handler.tokenResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  internal_handler.updateReportRequest:
    properties:
      collection:
        type: string
      name:
        type: string
      paramSchema:
        items:
          $ref: '#/definitions/bom-zustand-api_internal_model.ReportParam'
        type: array
      pipelineTemplate:
        type: string
    type: object
  internal_handler.updateTemplateRequest:
    properties:
      description:
        type: string
      htmlContent:
        type: string
      name:
        type: string
    type: object
  internal_handler.updateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        enum:
        - admin
        - manager
        - staff
        - viewer
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for bom-zustand-api, built on Echo.
  title: bom-zustand-api
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password given their current password.
      parameters:
      - description: Old and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the given email if an account exists
        for it. Always responds 200 to avoid leaking account existence.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Request a password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges email/password credentials for an access and refresh
        token pair.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the given refresh token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.refreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Log out
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Revokes every refresh token issued to the authenticated user.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Log out of all sessions
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the authenticated user along with their effective permissions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.meResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access and refresh token
        pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.tokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using the token emailed by the forgot-password
        flow.
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.resetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      summary: Reset password with a token
      tags:
      - auth
  /healthz:
    get:
      description: Returns ok if the service is up.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.healthResponse'
      summary: Health check
      tags:
      - health
  /reports:
    get:
      description: Lists report definitions with pagination, including each one's
        param schema. Requires the report:read permission.
      parameters:
      - description: Max number of report definitions to return
        in: query
        name: limit
        type: integer
      - description: Number of report definitions to skip
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/bom-zustand-api_internal_model.ReportDefinition'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List report definitions
      tags:
      - reports
    post:
      consumes:
      - application/json
      description: Pairs a template with a MongoDB aggregation pipeline and a param
        schema. Requires the report:create permission. Pipeline placeholders use Go
        template syntax, double-brace json dot paramName; wrap date params needing
        BSON Date comparison using the Extended JSON dollar-date form.
      parameters:
      - description: New report definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.ReportDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Create a report definition
      tags:
      - reports
  /reports/{id}:
    delete:
      description: Deletes a report definition. Requires the report:delete permission.
      parameters:
      - description: Report definition ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete a report definition
      tags:
      - reports
    get:
      description: Returns a report definition's param schema and template reference
        — this is the primary lookup the frontend uses to build a generation form.
        Requires the report:read permission.
      parameters:
      - description: Report definition ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.ReportDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a report definition
      tags:
      - reports
    patch:
      consumes:
      - application/json
      description: Partially updates a report definition's name, collection, pipeline,
        and/or param schema. Requires the report:update permission.
      parameters:
      - description: Report definition ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.ReportDefinition'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Update a report definition
      tags:
      - reports
  /reports/{id}/generate:
    post:
      consumes:
      - application/json
      description: Runs the report's query, renders its template, and converts the
        result to PDF via headless Chrome. Requires the report:generate permission.
      parameters:
      - description: Report definition ID
        in: path
        name: id
        required: true
        type: string
      - description: Report params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.generateReportRequest'
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Generate a report PDF
      tags:
      - reports
  /reports/{id}/preview:
    post:
      consumes:
      - application/json
      description: Runs the report's query and renders its template, returning raw
        HTML (no PDF conversion) — used by the frontend to show a live preview before
        generating. Requires the report:generate permission.
      parameters:
      - description: Report definition ID
        in: path
        name: id
        required: true
        type: string
      - description: Report params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.generateReportRequest'
      produces:
      - text/html
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Preview a report as HTML
      tags:
      - reports
  /templates:
    get:
      description: Lists templates with pagination. Requires the template:read permission.
      parameters:
      - description: Max number of templates to return
        in: query
        name: limit
        type: integer
      - description: Number of templates to skip
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/bom-zustand-api_internal_model.Template'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List templates
      tags:
      - templates
    post:
      consumes:
      - application/json
      description: Creates an HTML report template. Requires the template:create permission.
      parameters:
      - description: New template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.Template'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Create a template
      tags:
      - templates
  /templates/{id}:
    delete:
      description: Deletes a template. Requires the template:delete permission.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete a template
      tags:
      - templates
    get:
      description: Returns a single template, including its raw HTML content. Requires
        the template:read permission.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.Template'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get a template
      tags:
      - templates
    patch:
      consumes:
      - application/json
      description: Partially updates a template's name, description, and/or HTML content.
        Requires the template:update permission.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.Template'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Update a template
      tags:
      - templates
  /users:
    get:
      description: Lists users with pagination. Requires the user:read permission.
      parameters:
      - description: Max number of users to return
        in: query
        name: limit
        type: integer
      - description: Number of users to skip
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/bom-zustand-api_internal_model.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user account. Requires the user:create permission.
      parameters:
      - description: New user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bom-zustand-api_internal_model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
  /users/{id}:
    delete:
      description: Deactivates a user account. Requires the user:delete permission.
      parameters:
      - description: User ID
        in: path
